<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Admins</title>
  <link rel="icon" type="image/svg+xml" href="/images/favicon.ico">
</head>

<body style="margin:0; padding:0;">

<nav style="background:#213d60; padding:12px 20px; border-bottom:2px solid #2562eb;">
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="left">
                <a th:href="@{/}" style="font-size:26px; font-weight:700;
                    font-family:'Inter', sans-serif; color:white; text-decoration:none;">
                    Uni<span style="color:#2562eb;">Portal</span>
                </a>
            </td>

            <td align="right">
                <span style="display:inline-block;">
                    <form th:action="@{/logout}" method="post">
                    <button type="submit"
                            style="background:#e53935; color:white;
                        border:none; padding:12px 32px;
                        border-radius:6px; font-weight:600;
                        cursor:pointer; font-size:15px;">
                            Logout
                    </button>
                    </form>
                </span>
            </td>
        </tr>
    </table>
</nav>

<div style="padding:20px; background:#f2f5f9;">

  <div style="
        border:1px solid #ccc;
        background:white;
        border-radius:10px;
        margin-bottom:20px;
        overflow:hidden;
    ">

    <form th:action="@{/admin/admins/search}"
          method="post"
          style="
                padding:20px;
                display:flex;
                gap:10px;
        ">

      <input type="text"
             name="searchTerm"
             placeholder="Find an admin"

             style="
                    flex:1;
                    padding:11px 14px;
                    border:1px solid #ccc;
                    border-radius:6px;
                    font-size:15px;
                   ">

      <button type="submit"

              style="
                    padding:11px 28px;
                    background:#2562eb;
                    color:white;
                    border:none;
                    border-radius:6px;
                    cursor:pointer;
                    font-size:15px;
                    ">

        Search

      </button>

    </form>

  </div>

  <div style="
        border:1px solid #ccc;
        background:white;
        border-radius:10px;
        overflow:hidden;
    ">

    <div style="
            background:#3766a0;
            color:white;
            padding:14px 20px;
            font-weight:700;
            display:grid;
            grid-template-columns: 2fr 2fr 1fr 1.5fr;
            align-items:center;
            font-size:16px;
        ">

      <div>Admin</div>

      <div>Email</div>

      <div style="text-align:center;">Role</div>

      <div style="text-align:right;">Actions</div>

    </div>

    <div th:each="a : ${admins}"

         style="
            padding:16px 20px;
            border-bottom:1px solid #eee;
            display:grid;
            grid-template-columns: 2fr 2fr 1fr 1.5fr;
            align-items:center;
            font-weight:600;
            font-size:15px;
        ">

      <div style="font-weight:700;">

        <span th:text="${a.name + ' ' + a.surname}"></span>

      </div>

      <div style="font-weight:700;">

        <span th:text="${a.email}"></span>

      </div>

      <div style="text-align:center; font-weight:700;">

        <span th:text="${a.role}"></span>

      </div>

      <div style="
                text-align:right;
                display:flex;
                justify-content:flex-end;
                gap:10px;
            ">

        <a th:href="@{/admins/edit/{id}(id=${a.id})}"

           style="
                    background:#2562eb;
                    color:white;
                    text-decoration:none;
                    padding:8px 16px;
                    border-radius:6px;
                    font-size:14px;
                    font-weight:700;
                   ">

          Edit

        </a>

        <a th:href="@{/admins/delete/{id}(id=${a.id})}"

           style="
                    background:#d62828;
                    color:white;
                    text-decoration:none;
                    padding:8px 16px;
                    border-radius:6px;
                    font-size:14px;
                    font-weight:700;
                   ">

          Delete

        </a>

      </div>

    </div>

  </div>

</div>

</body>
</html>
