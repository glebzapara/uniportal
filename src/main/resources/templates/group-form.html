<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Group</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.ico">
</head>

<body style="margin:0; padding:0;">

<nav style="background:#213d60; padding:12px 20px; border-bottom:2px solid #2562eb;">
  <table width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="left">
        <a th:href="@{/}" style="font-size:26px; font-weight:700;
                    font-family:'Inter', sans-serif; color:white; text-decoration:none;">
          Uni<span style="color:#2562eb;">Portal</span>
        </a>
      </td>

            <td  align="right">
                <span th:if="${currentTeacher != null and currentTeacher.role == 'ROLE_TEACHER'}"
                      style="display:inline-block;">
                    <a th:href="@{/}" style="color:white; text-decoration:none;
                    margin:0 10px; font-size:17px; font-weight:500;">Home</a>

                    <a th:href="@{/schedule}" style="color:white; text-decoration:none;
                    margin:0 10px; font-size:17px; font-weight:500;">Schedule</a>

                    <a th:if="${currentStudent != null and currentStudent.role == 'ROLE_STUDENT'}"
                       th:href="@{/grades}" style="color:white; text-decoration:none;
                        margin:0 10px; font-size:17px; font-weight:500;">Grades</a>

                    <a th:if="${currentStudent != null and currentStudent.role == 'ROLE_STUDENT'}"
                       th:href="@{/group}" style="color:white; text-decoration:none;
                        margin:0 10px; font-size:17px; font-weight:500;">Group</a>

                    <a th:if="${currentStudent != null and currentStudent.role == 'ROLE_STUDENT'}"
                       th:href="@{/teachers}" style="color:white; text-decoration:none;
                        margin:0 10px; font-size:17px; font-weight:500;">Teachers</a>

                    <a th:if="${currentTeacher != null and currentTeacher.role == 'ROLE_TEACHER'}"
                       th:href="@{/students}" style="color:white; text-decoration:none;
                        margin:0 10px; font-size:17px; font-weight:500;">Students</a>

                    <span style="color:#888;">|</span>

                    <a th:if="${currentStudent != null}"
                       th:href="@{/students/{id}/profile(id=${currentStudent.id})}"
                       style="color:#2562eb; font-size:17px;font-weight:500;
                        text-decoration:none; margin-left:10px;">Profile</a>

                    <a th:if="${currentTeacher != null}"
                       th:href="@{/teachers/{id}/profile(id=${currentTeacher.id})}"
                       style="color:#2562eb; font-size:17px;font-weight:500;
                        text-decoration:none; margin-left:10px;">Profile</a>
                </span>
        </td>

        <td align="right">
            <span th:if="${currentAdmin != null}"
                style="display:inline-block;">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit"
                            style="background:#e53935; color:white;
                        border:none; padding:12px 32px;
                        border-radius:6px; font-weight:600;
                        cursor:pointer; font-size:15px;">
                                Logout
                        </button>
                    </form>
            </span>
        </td>
    </tr>
  </table>
</nav>

<div style="
    min-height:calc(100vh - 120px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
">

    <div style="
        width:550px;
        background:white;
        border:1px solid #ccc;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 8px 25px rgba(0,0,0,0.08);
    ">

        <div style="
            background:#3766a0;
            color:white;
            padding:16px 20px;
            font-size:18px;
            font-weight:700;
        ">
            Create Group
        </div>

        <form th:action="@{/groups}"
              th:object="${groupForm}"
              method="post"
              style="padding:30px;">

            <input type="hidden" th:field="*{id}">

            <div style="margin-bottom:18px;">
                <label style="font-weight:600;">Course</label>
                <input type="text"
                       th:field="*{course}"
                       style="width:100%; padding:12px; box-sizing:border-box;
                       border:1px solid #ccc; border-radius:6px; margin-top:6px;">
            </div>

            <div style="margin-bottom:18px;">
                <label style="font-weight:600;">Specialty Name</label>
                <input type="text"
                       th:field="*{name}"
                       style="width:100%; padding:12px; box-sizing:border-box;
                       border:1px solid #ccc; border-radius:6px; margin-top:6px;">
            </div>

            <div style="margin-bottom:18px;">
                <label style="font-weight:600;">Group Number</label>
                <input type="number"
                       th:field="*{number}"
                       style="width:100%; padding:12px; box-sizing:border-box;
                       border:1px solid #ccc; border-radius:6px; margin-top:6px;">
            </div>

            <div style="margin-bottom:18px;">
                <label style="font-weight:600;">Speciality</label>
                <input type="text"
                       th:field="*{speciality}"
                       style="width:100%; padding:12px; box-sizing:border-box;
                       border:1px solid #ccc; border-radius:6px; margin-top:6px;">
            </div>

            <div style="margin-bottom:24px;">
                <label style="font-weight:600;">Department</label>

                <select name="departmentId"
                        style="width:100%; padding:12px; box-sizing:border-box;
                        border:1px solid #ccc; border-radius:6px; margin-top:6px;">
                    <option value="">-- Select department --</option>

                    <option th:each="d : ${departments}"
                            th:value="${d.id}"
                            th:text="${d.name}">
                    </option>
                </select>
            </div>

            <button type="submit"
                    style="
                    width:100%;
                    padding:13px;
                    background:#2562eb;
                    color:white;
                    box-sizing:border-box;
                    border:none;
                    border-radius:6px;
                    font-size:15px;
                    font-weight:700;
                    cursor:pointer;
                    ">
                Save Group
            </button>

        </form>

    </div>

</div>

</body>
</html>
