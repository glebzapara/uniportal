<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Subject</title>
    <link rel="icon" type="image/svg+xml" href="/images/favicon.ico">
</head>

<body style="margin:0; padding:0;">

<nav style="background:#213d60; padding:12px 20px; border-bottom:2px solid #2562eb;">
    <table width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td align="left">
                <a th:href="@{/}" style="font-size:26px; font-weight:700;
                    font-family:'Inter', sans-serif; color:white; text-decoration:none;">
                    Uni<span style="color:#2562eb;">Portal</span>
                </a>
            </td>

            <td align="right">
                <span style="display:inline-block;">
                    <form th:action="@{/logout}" method="post">
                    <button type="submit"
                            style="background:#e53935; color:white;
                        border:none; padding:12px 32px;
                        border-radius:6px; font-weight:600;
                        cursor:pointer; font-size:15px;">
                            Logout
                    </button>
                    </form>
                </span>
            </td>
        </tr>
    </table>
</nav>

<div style="
    min-height:calc(100vh - 120px);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
">

    <div style="
        width:650px;
        background:white;
        border:1px solid #ccc;
        border-radius:10px;
        overflow:hidden;
        box-shadow:0 8px 25px rgba(0,0,0,0.08);
    ">

        <div style="
            background:#3766a0;
            color:white;
            padding:16px 20px;
            font-size:18px;
            font-weight:700;
        ">
            Create Subject
        </div>

        <form th:action="@{/subjects}"
              th:object="${subjectForm}"
              method="post"
              style="padding:30px;">

            <input type="hidden" th:field="*{id}">

            <div style="margin-bottom:18px;">
                <label style="font-weight:600;">Subject Name</label>
                <input type="text"
                       th:field="*{name}"
                       style="width:100%; padding:12px; box-sizing:border-box;
                       border:1px solid #ccc; border-radius:6px; margin-top:6px;">
            </div>

            <div style="margin-bottom:18px;">
                <label style="font-weight:600;">Course</label>
                <input type="number"
                       th:field="*{course}"
                       min="1"
                       max="6"
                       style="width:100%; padding:12px; box-sizing:border-box;
                       border:1px solid #ccc; border-radius:6px; margin-top:6px;">
            </div>

            <div style="margin-bottom:18px;">
                <label style="font-weight:600;">Group</label>

                <select name="groupId"
                        style="width:100%; padding:12px; box-sizing:border-box;
                        border:1px solid #ccc; border-radius:6px; margin-top:6px;">
                    <option value="">-- Select group --</option>

                    <option th:each="g : ${groups}"
                            th:value="${g.id}"
                            th:text="${g.name}">
                    </option>
                </select>
            </div>

            <div style="margin-bottom:18px;">
                <label style="font-weight:600;">Department</label>

                <select name="departmentId"
                        style="width:100%; padding:12px; box-sizing:border-box;
                        border:1px solid #ccc; border-radius:6px; margin-top:6px;">
                    <option value="">-- Select department --</option>

                    <option th:each="d : ${departments}"
                            th:value="${d.id}"
                            th:text="${d.name}">
                    </option>
                </select>
            </div>

            <div style="margin-bottom:24px;">
                <label style="font-weight:600;">Description</label>

                <div style="
                    font-size:12px;
                    color:#666;
                    margin-top:6px;
                    margin-bottom:8px;
                    line-height:1.4;
                ">
                    Use: <b>#LECTURES</b>, <b>#LABS</b>, <b>#RESOURCES</b> to split content.
                    Put links inside double quotes: <b>"https://example.com"</b>
                </div>

                <textarea th:field="*{description}"
                          style="
                          width:100%;
                          height:180px;
                          padding:12px;
                          box-sizing:border-box;
                          border:1px solid #ccc;
                          border-radius:6px;
                          resize:vertical;
                          ">
                </textarea>
            </div>

            <button type="submit"
                    style="
                    width:100%;
                    padding:13px;
                    background:#2562eb;
                    color:white;
                    box-sizing:border-box;
                    border:none;
                    border-radius:6px;
                    font-size:15px;
                    font-weight:700;
                    cursor:pointer;
                    ">
                Save Subject
            </button>

        </form>

    </div>

</div>

</body>
</html>
